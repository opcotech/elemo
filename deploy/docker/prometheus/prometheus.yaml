global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]
  - job_name: 'elemo-server'
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
        - 'elemo-server:35479'
  - job_name: 'elemo-worker'
    scheme: http
    metrics_path: /metrics
    static_configs:
      - targets:
        - 'elemo-worker:35480'
