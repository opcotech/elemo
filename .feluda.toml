# Feluda license scanner configuration.
# https://github.com/anistark/feluda#configuration-optional

[[dependencies.ignore]]
name = "github.com/opcotech/elemo"
reason = "Root module; Feluda reports Unknown because the local module has no separate license detection path."

[[dependencies.ignore]]
name = "github.com/opencontainers/go-digest"
reason = "Code is Apache-2.0; CC-BY-SA-4.0 applies only to README/CONTRIBUTING (LICENSE.docs), not distributed source."

[[dependencies.ignore]]
name = "pgregory.net/rapid"
reason = "MPL-2.0 weak file-level copyleft; compatible with AGPL-3.0 and only pulled in transitively via testcontainers/moby test types."

[[dependencies.ignore]]
name = "github.com/fasthttp-contrib/websocket"
reason = "Transitive go.sum entry with no LICENSE file; unused by the main module graph (go mod why: not needed)."

[[dependencies.ignore]]
name = "github.com/yudai/pp"
reason = "Transitive go.sum entry with no LICENSE file; unused by the main module graph (go mod why: not needed)."

[[dependencies.ignore]]
name = "github.com/iris-contrib/schema"
reason = "Transitive go.sum entry with no LICENSE file; unused by the main module graph (go mod why: not needed)."
