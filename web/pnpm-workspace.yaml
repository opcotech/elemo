onlyBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"
  - "@tailwindcss/oxide"
  - esbuild
  - unrs-resolver

overrides:
  # Keep on Babel 7: `>=7.29.6` alone resolves to 8.x, which has no default export
  # and breaks `@tanstack/start-plugin-core` (`import babel from "@babel/core"`).
  "@babel/core@<=7.29.0": ">=7.29.6 <9"
  # @istanbuljs/load-nyc-config asks for js-yaml ^3.13.1. That line pulls argparse 1
  # and sprintf-js, which has no patched release.
  js-yaml@<3.15.0: ">=3.15.2"
  # @hey-api/json-schema-ref-parser pins js-yaml 4.2.0.
  js-yaml@>=4.0.0 <4.3.0: ">=4.3.2"
  # uuid 8.x (Storybook test runner, jest-junit, istanbul) has no patched 8.x release.
  uuid@<11.1.1: ">=11.1.1"
