codecov:
  branch: main
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        base: auto

    patch:
      default:
        target: 80%
        threshold: 5%
        base: auto

ignore:
  - "cmd/**"
  - "tools/**"
  - "internal/testutil/**"
  - "internal/transport/http/api/**"
  - "**/*_test.go"
  - "**/*_gen.go"

comment:
  layout: "reach, diff, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

github_checks:
  annotations: false
