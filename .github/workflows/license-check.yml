name: License Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: { }

permissions:
  contents: read

concurrency:
  group: license-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-licenses:
    name: ORT
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GO_LICENSES_VERSION: v1.6.0
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - name: Use HTTPS instead of SSH for Git cloning
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "^1.26"
          cache-dependency-path: |
            go.sum
            tools/openapi-assemble/go.sum
            tools/pre-mailer/go.sum

      - name: Cache go-licenses
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ort/bin
          key: go-licenses-${{ env.GO_LICENSES_VERSION }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}
          restore-keys: |
            go-licenses-${{ env.GO_LICENSES_VERSION }}-${{ runner.os }}-

      - name: Cache ORT ScanCode results
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .ort/scanner
          key: ort-scancode-projects-92.4.0-${{ github.sha }}
          restore-keys: |
            ort-scancode-projects-92.4.0-

      - name: Run ORT (PR policy gate)
        if: ${{ github.event_name == 'pull_request' }}
        run: make ort.pr

      - name: Run ORT (full pipeline)
        if: ${{ github.event_name != 'pull_request' }}
        run: make ort

      - name: Upload ORT results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ort-results
          path: .ort/results
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
