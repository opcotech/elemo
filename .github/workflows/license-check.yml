name: License Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-licenses:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Feluda
        run: |
          curl -LO https://github.com/anistark/feluda/releases/download/v1.15.0/feluda-v1.15.0-x86_64.deb
          sudo dpkg -i feluda-v1.15.0-x86_64.deb

      - name: Check licenses
        run: |
            feluda \
                --language go \
                --project-license AGPL-3.0 \
                --ci-format github \
                --fail-on-restrictive
                # TODO: Enable `--fail-on-incompatible` once Feluda supports license
                #   exclusion and fixes compatibility matrix issues.
