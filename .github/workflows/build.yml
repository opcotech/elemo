name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "^1.26"
      - name: Check formatting
        run: make format.backend.check
      - name: Go CI Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --timeout 5m

  frontend-lint:
    name: Frontend Lint
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: make dep.frontend
      - name: Check formatting
        run: make format.frontend.check
      - name: Lint
        run: make lint.frontend
      - name: Typecheck
        run: make typecheck.frontend

  build-e2e-image:
    name: Build E2E Image
    runs-on: "ubuntu-latest"
    needs:
      - backend-lint
      - frontend-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build E2E image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: build/package/Dockerfile
          tags: elemo-server:latest
          outputs: type=docker,dest=${{ runner.temp }}/elemo-server.tar
          cache-from: type=gha,scope=elemo-server
          cache-to: type=gha,mode=max,scope=elemo-server
      - name: Upload E2E image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elemo-server-image
          path: ${{ runner.temp }}/elemo-server.tar
          if-no-files-found: error
          retention-days: 1

  backend-unit-test:
    name: Backend Unit Tests
    runs-on: "ubuntu-latest"
    needs:
      - backend-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "^1.26"
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: Execute unit tests
        run: make test.backend.unit
      - name: Stash test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: "unit-test-results"
          path: .coverage.unit.out
          include-hidden-files: true
          retention-days: 7

  backend-benchmark-test:
    name: Backend Benchmark Tests
    runs-on: "ubuntu-latest"
    needs:
      - backend-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "^1.26"
      - name: Execute benchmark tests
        run: make test.backend.bench

  backend-integration-test:
    name: Backend Integration Tests
    runs-on: "ubuntu-latest"
    needs:
      - backend-lint
      - backend-unit-test
      - backend-benchmark-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "^1.26"
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: Execute integration tests
        run: make test.backend.integration
      - name: Stash test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: "integration-test-results"
          path: .coverage.integration.out
          include-hidden-files: true
          retention-days: 7

  frontend-unit-test:
    name: Frontend Unit Tests
    runs-on: "ubuntu-latest"
    needs:
      - frontend-lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: make dep.frontend
      - name: Execute unit tests
        run: make test.frontend.unit

  frontend-build:
    name: Frontend Build
    runs-on: "ubuntu-latest"
    needs:
      - frontend-unit-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: make dep.frontend
      - name: Production build
        run: pnpm --dir web build
      - name: Storybook build
        run: pnpm --dir web storybook:build
      - name: Install Playwright Chromium for Storybook a11y
        run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Storybook a11y verification
        run: pnpm --dir web test-storybook:ci

  frontend-e2e-test:
    name: Frontend E2E Tests - ${{ matrix.project }} (shard ${{ matrix.shard }}/${{ matrix.total-shards }})
    runs-on: "ubuntu-latest"
    needs:
      - build-e2e-image
      - frontend-build
    strategy:
      matrix:
        shard: [1, 2, 3]
        total-shards: [3]
        project:
          - chromium
          - firefox
          - webkit
          # FIXME: enable "Mobile Chrome" once we support mobile viewports
          # FIXME: enable "Mobile Safari" once we support mobile viewports
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.13.1
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "^1.26"
      - name: Download E2E image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: elemo-server-image
          path: ${{ runner.temp }}
      - name: Load E2E image
        run: docker load --input "${{ runner.temp }}/elemo-server.tar"
      - name: Setup local env
        env:
          ELEMO_KEEP_BACKEND: "true"
          ELEMO_SKIP_IMAGE_BUILD: "true"
          PLAYWRIGHT_BROWSERS: ${{ matrix.project }}
        run: |
          ./scripts/setup.sh
          sed -i s/CI=false/CI=true/g web/.env.test.local

          # Wait for elemo-server to be ready
          timeout=15
          attempt=0

          while [ $attempt -lt $timeout ]; do
            if curl -sf "http://127.0.0.1:35478/v1/system/heartbeat" > /dev/null 2>&1; then
              echo "elemo-server is ready"
              break
            fi
            echo "Waiting for elemo-server to be ready... (attempt $((attempt + 1))/$timeout)"
            sleep 2
            attempt=$((attempt + 1))
          done

          if [ $attempt -eq $timeout ]; then
            echo "ERROR: elemo-server did not become ready within $((timeout * 2)) seconds"
            docker compose -f deploy/docker/docker-compose.yml ps
            docker compose -f deploy/docker/docker-compose.yml logs elemo-server
            exit 1
          fi

      - name: Execute end-to-end tests
        run: |
          pnpm --dir web test:e2e --project "${{ matrix.project }}" --shard=${{ matrix.shard }}/${{ matrix.total-shards }}
      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "e2e-test-results-${{ matrix.project }}-shard-${{ matrix.shard }}"
          path: web/test-results
          retention-days: 7
      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "playwright-report-${{ matrix.project }}-shard-${{ matrix.shard }}"
          path: web/playwright-report
          retention-days: 7
      - name: Stop backend services
        if: always()
        run: |
          make stop.backend

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs:
      - backend-unit-test
      - backend-integration-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "^1.26"
      - name: Unstash unit test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "unit-test-results"
      - name: Unstash integration test results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: "integration-test-results"
      - name: Combine coverage reports
        run: make test.backend.coverage
      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: .coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: opcotech/elemo
          fail_ci_if_error: true
