name: Release Please

on:
  workflow_call:
    secrets:
      RELEASE_PLEASE_TOKEN:
        description: Optional token used to create release pull requests
        required: false
  workflow_dispatch:

# GITHUB_TOKEN can open release PRs only when the repository setting
# Settings → Actions → General → Workflow permissions →
# "Allow GitHub Actions to create and approve pull requests" is enabled.
#
# Optional: set repository secret RELEASE_PLEASE_TOKEN to a PAT (classic or
# fine-grained) with contents:write and pull-requests:write. Prefer that when
# release PRs must trigger other workflows (GITHUB_TOKEN PRs do not).
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create release PR or GitHub Release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  attach-legal-bundle:
    name: Attach legal bundle
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GO_LICENSES_VERSION: v1.6.0
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: ./.github/actions/setup-ort

      - name: Run ORT
        run: ./scripts/ort/ort.sh run

      - name: Upload legal bundle to the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            .ort/results/legal/* \
            --clobber
