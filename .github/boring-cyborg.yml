labelPRBasedOnFilePath:
  "component: api":
    - api/**/*
    - internal/transport/http/**/*
  "component: auth":
    - internal/transport/http/auth.go
  "component: build":
    - .github/**/*
    - build/**/*
    - Makefile
  "component: configs":
    - configs/**/*
    - internal/config/**/*
  "component: deployments":
    - deploy/**/*
  "component: front-end":
    - web/**/*
  "type: legal":
    - LICENSE
  "component: license":
    - internal/license/**/*
    - tool/key-generator/**/*
    - tool/license-generator/**/*
    - tool/license-validator/**/*
