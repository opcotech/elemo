"/v1/organizations/{organizationRef}/teams":
  parameters:
    - $ref: "#/components/parameters/organizationRef"
  get:
    summary: Get organization teams
    description: Return the teams that belong to the organization.
    operationId: v1OrganizationTeamsGet
    tags:
      - Organization
      - Team
    security:
      - oauth2:
          - organization.read
    parameters:
      - $ref: "#/components/parameters/page_size"
      - $ref: "#/components/parameters/page_token"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamPage"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
  post:
    summary: Create a new team in the organization
    operationId: v1OrganizationTeamsCreate
    responses:
      "201":
        $ref: "#/components/responses/201"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    description: Create a new team and assign it to the organization.
    security:
      - oauth2:
          - organization
    tags:
      - Organization
      - Team
    requestBody:
      $ref: "#/components/requestBodies/TeamCreate"
"/v1/organizations/{organizationRef}/teams/{team_id}":
  parameters:
    - $ref: "#/components/parameters/organizationRef"
    - schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      name: team_id
      in: path
      required: true
      description: ID of the team.
  get:
    summary: Get organization team
    operationId: v1OrganizationTeamGet
    tags:
      - Organization
      - Team
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Team"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    security:
      - oauth2:
          - organization.read
    description: Returns the given organization team by its ID.
  patch:
    summary: Update organization team
    operationId: v1OrganizationTeamUpdate
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Team"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    description: Update the organization team by its ID.
    security:
      - oauth2:
          - organization
    tags:
      - Organization
      - Team
    requestBody:
      $ref: "#/components/requestBodies/TeamPatch"
  delete:
    summary: Delete organization team
    operationId: v1OrganizationTeamDelete
    tags:
      - Organization
      - Team
    responses:
      "204":
        description: No Content
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    description: Deletes a team that belongs to the organization.
    security:
      - oauth2:
          - organization
"/v1/organizations/{organizationRef}/teams/{team_id}/members":
  parameters:
    - $ref: "#/components/parameters/organizationRef"
    - schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      name: team_id
      in: path
      required: true
      description: ID of the team.
  get:
    summary: Get organization team members
    tags:
      - Organization
      - Team
      - User
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPage"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    operationId: v1OrganizationTeamMembersGet
    security:
      - oauth2:
          - organization.read
          - user.read
    description: Return a cursor-paginated page of users that are members of the organization's team.
    parameters:
      - $ref: "#/components/parameters/page_size"
      - $ref: "#/components/parameters/page_token"
  post:
    summary: Add organization team member
    operationId: v1OrganizationTeamMembersAdd
    responses:
      "201":
        $ref: "#/components/responses/201"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    description: Add an existing user to an organization's team.
    security:
      - oauth2:
          - organization
    tags:
      - Organization
      - Team
      - User
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              user_id:
                type: string
                description: ID of the user to add.
                example: 9bsv0s46s6s002p9ltq0
            required:
              - user_id
"/v1/organizations/{organizationRef}/teams/{team_id}/members/{user_id}":
  parameters:
    - $ref: "#/components/parameters/organizationRef"
    - schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      name: team_id
      in: path
      required: true
      description: ID of the team.
    - schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      name: user_id
      in: path
      required: true
      description: ID of the user.
  delete:
    summary: Remove organization team member
    operationId: v1OrganizationTeamMemberRemove
    responses:
      "204":
        description: No Content
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    description: Removes a member from the organization's team.
    security:
      - oauth2:
          - organization
    tags:
      - Organization
      - Team
      - User
