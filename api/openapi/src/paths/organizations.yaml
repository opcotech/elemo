/v1/organizations:
  get:
    summary: Get organizations
    tags:
      - Organization
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationPage"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "500":
        $ref: "#/components/responses/500"
    operationId: v1OrganizationsGet
    description: Returns the list of organizations in the system.
    security:
      - oauth2:
          - organization.read
    parameters:
      - $ref: "#/components/parameters/page_size"
      - $ref: "#/components/parameters/page_token"
  post:
    summary: Create organization
    operationId: v1OrganizationsCreate
    responses:
      "201":
        $ref: "#/components/responses/201"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "409":
        $ref: "#/components/responses/409"
      "500":
        $ref: "#/components/responses/500"
    description: Create a new organization.
    security:
      - oauth2:
          - organization
    tags:
      - Organization
    requestBody:
      $ref: "#/components/requestBodies/OrganizationCreate"
"/v1/organizations/{organizationRef}":
  parameters:
    - $ref: "#/components/parameters/organizationRef"
  get:
    summary: Get organization
    tags:
      - Organization
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Organization"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    operationId: v1OrganizationGet
    security:
      - oauth2:
          - organization.read
    description: Returns the given organization by its ID.
  delete:
    summary: Delete organization
    operationId: v1OrganizationDelete
    responses:
      "204":
        description: No Content
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    description: Delete the organization by its ID.
    security:
      - oauth2:
          - organization
    tags:
      - Organization
    parameters:
      - $ref: "#/components/parameters/force"
  patch:
    summary: Update organization
    operationId: v1OrganizationUpdate
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Organization"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    description: Update the organization by its ID.
    security:
      - oauth2:
          - organization
    tags:
      - Organization
    requestBody:
      $ref: "#/components/requestBodies/OrganizationPatch"
"/v1/organizations/{organizationRef}/members":
  parameters:
    - $ref: "#/components/parameters/organizationRef"
  get:
    summary: Get organization members
    tags:
      - Organization
      - User
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationMemberPage"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    operationId: v1OrganizationMembersGet
    security:
      - oauth2:
          - organization.read
          - user.read
    description: Return a cursor-paginated page of users that are members of the organization.
    parameters:
      - $ref: "#/components/parameters/page_size"
      - $ref: "#/components/parameters/page_token"
  post:
    summary: Add organization member
    operationId: v1OrganizationMembersAdd
    responses:
      "201":
        $ref: "#/components/responses/201"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    description: Add an existing user to an organization.
    security:
      - oauth2:
          - organization
    tags:
      - Organization
      - User
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              user_id:
                type: string
                description: ID of the user to add.
                example: 9bsv0s46s6s002p9ltq0
            required:
              - user_id
"/v1/organizations/{organizationRef}/members/invite":
  parameters:
    - $ref: "#/components/parameters/organizationRef"
  post:
    summary: Invite member to organization
    operationId: v1OrganizationMembersInvite
    responses:
      "201":
        $ref: "#/components/responses/201"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    description: Send an invitation email to a user to join the organization. If the user doesn't exist, a pending user will be created.
    security:
      - oauth2:
          - organization
    tags:
      - Organization
      - User
    requestBody:
      content:
        application/json:
          schema:
            type: object
            properties:
              email:
                type: string
                format: email
                description: Email address of the user to invite.
                example: user@example.com
              role_id:
                type: string
                description: Optional role ID to assign the user to when they accept the invitation.
                example: 9bsv0s46s6s002p9ltq0
            required:
              - email
"/v1/organizations/{organizationRef}/members/{user_id}":
  parameters:
    - $ref: "#/components/parameters/organizationRef"
    - schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      name: user_id
      in: path
      required: true
      description: ID of the user.
  delete:
    summary: Remove organization member
    operationId: v1OrganizationMemberRemove
    responses:
      "204":
        description: No Content
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    description: Removes a member from the organization
    security:
      - oauth2:
          - organization
    tags:
      - Organization
      - User
"/v1/organizations/{organizationRef}/members/{user_id}/invite":
  parameters:
    - $ref: "#/components/parameters/organizationRef"
    - schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      name: user_id
      in: path
      required: true
      description: ID of the user.
  delete:
    summary: Revoke invitation
    operationId: v1OrganizationMemberInviteRevoke
    responses:
      "204":
        description: No Content
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    description: Revoke an invitation for a user to join the organization
    security:
      - oauth2:
          - organization
    tags:
      - Organization
      - User
"/v1/organizations/{organizationRef}/members/accept":
  parameters:
    - $ref: "#/components/parameters/organizationRef"
  post:
    summary: Accept organization invitation
    operationId: v1OrganizationMembersAccept
    responses:
      "200":
        description: OK
      "204":
        description: Invitation accepted successfully
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
    description: Accept an invitation to join an organization using an invitation token. If the user is pending, they will be activated.
    security: []
    tags:
      - Organization
      - User
    requestBody:
      $ref: "#/components/requestBodies/OrganizationInvitationAccept"
