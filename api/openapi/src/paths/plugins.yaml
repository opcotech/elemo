"/v1/plugins/{pluginId}/config":
  parameters:
    - $ref: "#/components/parameters/pluginId"
  get:
    summary: Get plugin activation config
    tags:
      - Plugin
    operationId: v1PluginConfigGet
    description: >
      Return the activation config for the given manage scope. Requires
      plugin.manage. Empty object when the plugin has no config on that scope.
    security:
      - oauth2:
          - plugin
    parameters:
      - name: scope_id
        in: query
        required: true
        schema:
          type: string
      - name: scope_type
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/ResourceType"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginConfig"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
  patch:
    summary: Update plugin activation config
    tags:
      - Plugin
    operationId: v1PluginConfigPatch
    description: Write activation config on the given scope. Requires plugin.manage.
    security:
      - oauth2:
          - plugin
    parameters:
      - name: scope_id
        in: query
        required: true
        schema:
          type: string
      - name: scope_type
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/ResourceType"
    requestBody:
      $ref: "#/components/requestBodies/PluginConfigUpdate"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginConfig"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
