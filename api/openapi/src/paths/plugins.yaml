"/v1/plugins":
  get:
    summary: List installed plugins
    tags:
      - Plugin
    operationId: v1PluginsGet
    description: >
      List installed plugins. Without a scope this requires plugin.install
      (instance catalog). With scope_id and scope_type it requires plugin.manage
      on that scope and includes the scoped enabled flag.
    security:
      - oauth2:
          - plugin.read
    parameters:
      - name: scope_id
        in: query
        required: false
        schema:
          type: string
      - name: scope_type
        in: query
        required: false
        schema:
          $ref: "#/components/schemas/ResourceType"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/Plugin"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "500":
        $ref: "#/components/responses/500"
  post:
    summary: Install a plugin package
    tags:
      - Plugin
    operationId: v1PluginsCreate
    description: Upload a plugin zip. The package is loaded but not enabled.
    security:
      - oauth2:
          - plugin
    requestBody:
      $ref: "#/components/requestBodies/PluginPackage"
    responses:
      "201":
        description: Created
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Plugin"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "409":
        $ref: "#/components/responses/409"
      "500":
        $ref: "#/components/responses/500"
"/v1/plugins/frontend":
  get:
    summary: List active frontend plugins
    tags:
      - Plugin
    operationId: v1PluginsFrontendGet
    description: >
      Return frontend modules for plugins enabled on the given scope or its
      IN_SCOPE_OF ancestors. Requires read on the scope, not plugin.manage.
    security:
      - oauth2:
          - plugin.read
    parameters:
      - name: scope_id
        in: query
        required: true
        schema:
          type: string
      - name: scope_type
        in: query
        required: true
        schema:
          $ref: "#/components/schemas/ResourceType"
    responses:
      "200":
        description: OK
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/FrontendPlugin"
      "400":
        $ref: "#/components/responses/400"
      "401":
        $ref: "#/components/responses/401"
      "403":
        $ref: "#/components/responses/403"
      "404":
        $ref: "#/components/responses/404"
      "500":
        $ref: "#/components/responses/500"
