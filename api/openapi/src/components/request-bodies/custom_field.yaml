CustomFieldCreate:
  content:
    application/json:
      schema:
        type: object
        additionalProperties: false
        required:
          - key
          - name
          - kind
          - scope_id
          - scope_type
          - target_type
          - schema
        properties:
          key:
            type: string
            pattern: "^[a-z][a-z0-9_]{1,62}$"
            example: story_points
          name:
            type: string
            minLength: 3
            maxLength: 120
            example: Story points
          description:
            type: string
            maxLength: 500
          kind:
            $ref: "#/components/schemas/CustomFieldKind"
          scope_id:
            type: string
            example: 9bsv0s46s6s002p9ltq0
          scope_type:
            $ref: "#/components/schemas/ResourceType"
          target_type:
            $ref: "#/components/schemas/ResourceType"
          required:
            type: boolean
          index_exact:
            type: boolean
          index_range:
            type: boolean
          index_fulltext:
            type: boolean
          order:
            type: integer
          schema:
            $ref: "#/components/schemas/CustomFieldSchema"
CustomFieldPatch:
  content:
    application/json:
      schema:
        type: object
        additionalProperties: false
        properties:
          name:
            type: string
            minLength: 3
            maxLength: 120
            x-go-type: "Optional[string]"
            x-go-type-skip-optional-pointer: true
          description:
            type: string
            maxLength: 500
            x-go-type: "Optional[string]"
            x-go-type-skip-optional-pointer: true
          required:
            type: boolean
            x-go-type: "Optional[bool]"
            x-go-type-skip-optional-pointer: true
          archived:
            type: boolean
            x-go-type: "Optional[bool]"
            x-go-type-skip-optional-pointer: true
          index_exact:
            type: boolean
            x-go-type: "Optional[bool]"
            x-go-type-skip-optional-pointer: true
          index_range:
            type: boolean
            x-go-type: "Optional[bool]"
            x-go-type-skip-optional-pointer: true
          index_fulltext:
            type: boolean
            x-go-type: "Optional[bool]"
            x-go-type-skip-optional-pointer: true
          order:
            type: integer
            x-go-type: "Optional[int]"
            x-go-type-skip-optional-pointer: true
          schema:
            $ref: "#/components/schemas/CustomFieldSchema"
CustomFieldValuePut:
  content:
    application/json:
      schema:
        $ref: "#/components/schemas/CustomFieldValue"
CustomFieldSearch:
  content:
    application/json:
      schema:
        type: object
        additionalProperties: false
        required:
          - definition_id
          - op
        properties:
          definition_id:
            type: string
          op:
            $ref: "#/components/schemas/CustomFieldPredicateOp"
          text:
            type: string
          integer:
            type: integer
            format: int64
          decimal:
            type: string
          boolean:
            type: boolean
          date:
            type: string
            format: date
          datetime:
            type: string
            format: date-time
          url:
            type: string
          option_key:
            type: string
          user_id:
            type: string
          resource_id:
            type: string
          limit:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
