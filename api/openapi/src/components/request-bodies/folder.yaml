FolderCreate:
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Name of the folder.
            minLength: 1
            maxLength: 120
            example: Guides
          parent_id:
            type: string
            description: Parent folder ID. Omit to create at the library root.
            example: 9bsv0s46s6s002p9ltq0
            nullable: true
        required:
          - name
FolderPatch:
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Name of the folder.
            minLength: 1
            maxLength: 120
            example: Guides
            x-go-type: "Optional[string]"
            x-go-type-skip-optional-pointer: true
          parent_id:
            type: string
            description: Parent folder ID. JSON null moves the folder to the library root.
            example: 9bsv0s46s6s002p9ltq0
            nullable: true
            x-go-type: "Optional[string]"
            x-go-type-skip-optional-pointer: true
