IssueCreate:
  content:
    application/json:
      schema:
        type: object
        properties:
          parent:
            type: string
            description: ID of the parent issue.
            example: 9bsv0s46s6s002p9ltq0
            nullable: true
          kind:
            $ref: "#/components/schemas/IssueKind"
          title:
            type: string
            description: Title of the issue.
            minLength: 3
            maxLength: 120
            example: Implement authentication
          description:
            type: string
            description: Description of the issue.
            minLength: 3
            example: Add OAuth2 password and authorization code flows.
            nullable: true
            x-go-type: "Optional[string]"
            x-go-type-skip-optional-pointer: true
          status:
            $ref: "#/components/schemas/IssueStatus"
          priority:
            $ref: "#/components/schemas/IssuePriority"
          resolution:
            $ref: "#/components/schemas/IssueResolution"
          links:
            type: array
            description: External links related to the issue.
            items:
              $ref: "#/components/schemas/IssueLink"
          due_date:
            type: string
            format: date-time
            description: Due date of the issue.
            nullable: true
          start_date:
            type: string
            format: date-time
            description: Start date of the issue.
            nullable: true
        required:
          - kind
          - title
IssuePatch:
  content:
    application/json:
      schema:
        type: object
        properties:
          kind:
            $ref: "#/components/schemas/IssueKind"
          title:
            type: string
            description: Title of the issue.
            minLength: 3
            maxLength: 120
            example: Implement authentication
            x-go-type: "Optional[string]"
            x-go-type-skip-optional-pointer: true
          description:
            type: string
            description: Description of the issue.
            minLength: 3
            example: Add OAuth2 password and authorization code flows.
            nullable: true
            x-go-type: "Optional[string]"
            x-go-type-skip-optional-pointer: true
          status:
            $ref: "#/components/schemas/IssueStatus"
          priority:
            $ref: "#/components/schemas/IssuePriority"
          resolution:
            $ref: "#/components/schemas/IssueResolution"
          links:
            type: array
            description: External links related to the issue.
            items:
              $ref: "#/components/schemas/IssueLink"
            x-go-type: "Optional[[]IssueLink]"
            x-go-type-skip-optional-pointer: true
          due_date:
            type: string
            format: date-time
            description: Due date of the issue.
            nullable: true
            x-go-type: "Optional[time.Time]"
            x-go-type-skip-optional-pointer: true
          assignees:
            type: array
            description: IDs of users assigned to the issue. Empty array clears assignees.
            uniqueItems: true
            items:
              type: string
            x-go-type: "Optional[[]string]"
            x-go-type-skip-optional-pointer: true
          reviewers:
            type: array
            description: IDs of users reviewing the issue. Empty array clears reviewers.
            uniqueItems: true
            items:
              type: string
            x-go-type: "Optional[[]string]"
            x-go-type-skip-optional-pointer: true
          labels:
            type: array
            description: IDs of labels attached to the issue. Empty array clears labels.
            uniqueItems: true
            items:
              type: string
            x-go-type: "Optional[[]string]"
            x-go-type-skip-optional-pointer: true
          start_date:
            type: string
            format: date-time
            description: Start date of the issue.
            nullable: true
            x-go-type: "Optional[time.Time]"
            x-go-type-skip-optional-pointer: true
          parent:
            type: string
            description: ID of the parent issue. Null clears the parent. Omitted leaves the parent unchanged.
            example: 9bsv0s46s6s002p9ltq0
            nullable: true
            x-go-type: "Optional[string]"
            x-go-type-skip-optional-pointer: true
IssueRelationCreate:
  content:
    application/json:
      schema:
        type: object
        properties:
          related_id:
            type: string
            description: ID of the related issue. The created edge is always outgoing from the issue in the URL.
            example: 9bsv0s46s6s002p9ltq0
          kind:
            $ref: "#/components/schemas/IssueRelationKind"
        required:
          - related_id
          - kind
IssueRelationPatch:
  content:
    application/json:
      schema:
        type: object
        properties:
          kind:
            $ref: "#/components/schemas/IssueRelationKind"
        required:
          - kind
