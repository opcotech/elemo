NamespaceCreate:
  content:
    application/json:
      schema:
        type: object
        properties:
          name:
            type: string
            description: Name of the namespace.
            maxLength: 120
            example: Engineering
            minLength: 3
          logo:
            type: string
            description: Logo of the namespace.
            format: uri
            example: "https://example.com/static/logo.png"
            maxLength: 2000
            nullable: true
          slug:
            type: string
            description: Organization-scoped canonical kebab-case slug. Reserved value is new. Must not parse as an xid.
            minLength: 3
            maxLength: 50
            pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
            example: platform
          description:
            type: string
            description: Description of the namespace.
            maxLength: 500
            example: Engineering team namespace
            minLength: 5
            nullable: true
            x-go-type: "Optional[string]"
            x-go-type-skip-optional-pointer: true
        required:
          - name
          - slug
