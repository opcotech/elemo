UserPasswordReset:
  description: "Password reset request."
  content:
    application/json:
      schema:
        type: object
        properties:
          token:
            type: string
            example: tDCVsHnzeOj278GIT85xU0s_
            description: Token to verify
          password:
            type: string
            format: password
            maxLength: 64
            minLength: 8
            example: super-secret
            description: Password of the user.
        required:
          - password
          - token
