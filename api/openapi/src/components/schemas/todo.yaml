Todo:
  title: Todo
  type: object
  description: A todo item belonging to a user.
  x-examples:
    example:
      id: 9bsv0s46s6s002p9ltq0
      title: Do something great
      description: I'll make the world a better place today.
      priority: normal
      completed: true
      owned_by: string
      created_by: string
      due_date: null
      created_at: "2019-08-24T14:15:22Z"
      updated_at: null
  properties:
    id:
      type: string
      description: Unique identifier of the todo.
      example: 9bsv0s46s6s002p9ltq0
    title:
      type: string
      minLength: 3
      maxLength: 250
      example: Do something great
      description: Title of the todo item.
    description:
      type: string
      minLength: 10
      maxLength: 500
      example: I'll make the world a better place today.
      description: Description of the todo item.
    priority:
      $ref: "#/components/schemas/TodoPriority"
    completed:
      type: boolean
      default: true
      description: Status of the todo item.
    owned_by:
      type: string
      description: ID of the user who owns the todo item.
    created_by:
      type: string
      description: ID of the user who created the todo item.
    due_date:
      type: string
      format: date-time
      description: Completion due date of the todo item.
      nullable: true
    created_at:
      type: string
      format: date-time
      description: Date when the todo item was created.
    updated_at:
      type: string
      format: date-time
      description: Date when the todo item was updated.
      nullable: true
  required:
    - id
    - title
    - description
    - priority
    - completed
    - owned_by
    - created_by
    - due_date
    - created_at
    - updated_at
TodoPriority:
  type: string
  enum:
    - normal
    - important
    - urgent
    - critical
  example: urgent
  minLength: 6
  maxLength: 9
  description: Priority of the todo item.
TodoPage:
  title: TodoPage
  type: object
  properties:
    items:
      type: array
      items:
        $ref: "#/components/schemas/Todo"
    page_info:
      $ref: "#/components/schemas/PageInfo"
  required:
    - items
    - page_info
