Team:
  title: Team
  type: object
  description: A team of users that belongs to an organization.
  x-examples:
    example:
      id: 9bsv0s46s6s002p9ltq0
      name: Platform
      description: Platform engineering team.
      member_count: 4
      created_at: "2023-01-01T00:00:00Z"
      updated_at: null
  properties:
    id:
      type: string
      description: Unique identifier of the team.
      example: 9bsv0s46s6s002p9ltq0
    name:
      type: string
      description: Name of the team.
      maxLength: 120
      example: Platform
      minLength: 3
    description:
      type: string
      description: Description of the team.
      maxLength: 500
      example: Platform engineering team.
      minLength: 5
      nullable: true
    member_count:
      type: integer
      format: int64
      description: Number of users in the team when projected.
      example: 4
      nullable: true
    created_at:
      type: string
      format: date-time
      description: Date when the team was created.
    updated_at:
      type: string
      format: date-time
      description: Date when the team was updated.
      nullable: true
  required:
    - id
    - name
    - created_at
    - updated_at
TeamPage:
  title: TeamPage
  type: object
  properties:
    items:
      type: array
      items:
        $ref: "#/components/schemas/Team"
    page_info:
      $ref: "#/components/schemas/PageInfo"
  required:
    - items
    - page_info
