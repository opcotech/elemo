SystemHealth:
  title: SystemHealth
  type: object
  properties:
    cache_database:
      type: string
      enum:
        - healthy
        - unhealthy
        - unknown
      minLength: 7
      maxLength: 9
      description: Health of the cache database.
    graph_database:
      type: string
      enum:
        - healthy
        - unhealthy
        - unknown
      minLength: 7
      maxLength: 9
      description: Health of the graph database.
    relational_database:
      type: string
      enum:
        - healthy
        - unhealthy
        - unknown
      minLength: 7
      maxLength: 9
      description: Health of the relational database.
    message_queue:
      type: string
      enum:
        - healthy
        - unhealthy
        - unknown
      minLength: 7
      maxLength: 9
      description: Health of the message queue.
    search:
      type: string
      enum:
        - healthy
        - unhealthy
        - unknown
      minLength: 7
      maxLength: 9
      description: Health of the search engine.
  required:
    - cache_database
    - graph_database
    - relational_database
    - message_queue
    - search
  x-examples:
    example:
      cache_database: healthy
      graph_database: healthy
      relational_database: healthy
      message_queue: healthy
      search: healthy
SystemVersion:
  title: SystemVersion
  type: object
  properties:
    version:
      type: string
      description: Version of the application.
      pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
    commit:
      type: string
      description: Commit hash of the build.
      pattern: "^[0-9a-f]{5,40}$"
    date:
      type: string
      format: date-time
      description: Build date and time of the application.
    go_version:
      type: string
      description: Go version used to build the application.
      pattern: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
  required:
    - version
    - commit
    - date
    - go_version
SystemEntitlements:
  title: SystemEntitlements
  type: object
  description: Deployment mode and AirGap seat entitlement status.
  properties:
    deployment_mode:
      type: string
      enum:
        - self_hosted
        - airgap
      description: Compile-time deployment mode of this binary.
    airgap:
      $ref: "#/components/schemas/SystemAirGapEntitlement"
      description: AirGap entitlement details. Omitted for normal self-hosted deployments.
      nullable: true
  required:
    - deployment_mode
SystemAirGapEntitlement:
  title: SystemAirGapEntitlement
  type: object
  description: AirGap human-seat entitlement as evaluated on this installation.
  properties:
    state:
      type: string
      enum:
        - valid
        - grace
        - expired
        - not_yet_valid
        - invalid
        - missing
      description: Lifecycle state of the License.
    reason:
      type: string
      description: Human-readable evaluation reason when the license is not valid.
    installation_id:
      type: string
      format: uuid
      description: Logical installation identity used for license binding.
    license_id:
      type: string
      format: uuid
      description: Identifier of the verified license when available.
    customer:
      type: string
      description: Customer name from the verified license.
    key_id:
      type: string
      description: Signing key identifier of the verified license.
    seats_licensed:
      type: integer
      minimum: 0
      description: Licensed active-human seat count when a payload was verified.
    seats_active:
      type: integer
      minimum: 0
      description: Current number of active human users.
    issued_at:
      type: string
      format: date-time
    not_before:
      type: string
      format: date-time
    expires_at:
      type: string
      format: date-time
    grace_ends_at:
      type: string
      format: date-time
      description: End of the 30-day grace window after expiration.
  required:
    - state
    - installation_id
    - seats_active
