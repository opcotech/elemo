Folder:
  title: Folder
  type: object
  description: A nested folder in an organization or namespace document library.
  properties:
    id:
      type: string
      description: Unique identifier of the folder.
      example: 9bsv0s46s6s002p9ltq0
    name:
      type: string
      description: Name of the folder.
      minLength: 1
      maxLength: 120
      example: Guides
    library:
      $ref: "#/components/schemas/DocumentLibrary"
    parent:
      allOf:
        - $ref: "#/components/schemas/DocumentFolder"
      nullable: true
    created_by:
      $ref: "#/components/schemas/PartialUser"
    created_at:
      type: string
      format: date-time
      description: Date when the folder was created.
    updated_at:
      type: string
      format: date-time
      description: Date when the folder was updated.
      nullable: true
  required:
    - id
    - name
    - library
    - parent
    - created_by
    - created_at
    - updated_at
FolderPage:
  title: FolderPage
  type: object
  properties:
    items:
      type: array
      items:
        $ref: "#/components/schemas/Folder"
    page_info:
      $ref: "#/components/schemas/PageInfo"
  required:
    - items
    - page_info
