PartialLabel:
  title: PartialLabel
  type: object
  description: A simplified label used on issue list and detail responses.
  x-examples:
    example:
      id: 9bsv0s46s6s002p9ltq0
      name: frontend
  properties:
    id:
      type: string
      description: Unique identifier of the label.
      example: 9bsv0s46s6s002p9ltq0
    name:
      type: string
      description: Name of the label.
      minLength: 3
      maxLength: 120
      example: frontend
  required:
    - id
    - name
Label:
  title: Label
  type: object
  description: A label that can be attached to resources.
  x-examples:
    example:
      id: 9bsv0s46s6s002p9ltq0
      name: frontend
      description: Frontend work
      created_at: "2023-01-01T00:00:00Z"
      updated_at: null
  properties:
    id:
      type: string
      description: Unique identifier of the label.
      example: 9bsv0s46s6s002p9ltq0
    name:
      type: string
      description: Name of the label.
      minLength: 3
      maxLength: 120
      example: frontend
    description:
      type: string
      description: Description of the label.
      minLength: 5
      maxLength: 500
      example: Frontend work
      nullable: true
    created_at:
      type: string
      format: date-time
      description: Date when the label was created.
    updated_at:
      type: string
      format: date-time
      description: Date when the label was updated.
      nullable: true
  required:
    - id
    - name
    - created_at
    - updated_at
LabelPage:
  title: LabelPage
  type: object
  properties:
    items:
      type: array
      items:
        $ref: "#/components/schemas/Label"
    page_info:
      $ref: "#/components/schemas/PageInfo"
  required:
    - items
    - page_info
