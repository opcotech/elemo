CustomFieldKind:
  title: CustomFieldKind
  type: string
  enum:
    - text
    - integer
    - decimal
    - boolean
    - date
    - datetime
    - url
    - single_select
    - multi_select
    - user_reference
    - resource_reference
CustomFieldOption:
  title: CustomFieldOption
  type: object
  additionalProperties: false
  required:
    - key
    - label
    - disabled
  properties:
    key:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,62}$"
      example: prod
    label:
      type: string
      minLength: 1
      maxLength: 120
      example: Production
    color:
      type: string
      maxLength: 32
      example: "#3366ff"
    disabled:
      type: boolean
    order:
      type: integer
CustomFieldTextSchema:
  title: CustomFieldTextSchema
  type: object
  additionalProperties: false
  required:
    - kind
  properties:
    kind:
      type: string
      enum:
        - text
    min_length:
      type: integer
      minimum: 0
    max_length:
      type: integer
      minimum: 0
      maximum: 8000
    pattern:
      type: string
CustomFieldIntegerSchema:
  title: CustomFieldIntegerSchema
  type: object
  additionalProperties: false
  required:
    - kind
  properties:
    kind:
      type: string
      enum:
        - integer
    min:
      type: integer
      format: int64
    max:
      type: integer
      format: int64
CustomFieldDecimalSchema:
  title: CustomFieldDecimalSchema
  type: object
  additionalProperties: false
  required:
    - kind
  properties:
    kind:
      type: string
      enum:
        - decimal
    min:
      type: string
      example: "0.01"
    max:
      type: string
      example: "100.00"
    scale:
      type: integer
      minimum: 0
      maximum: 38
CustomFieldBooleanSchema:
  title: CustomFieldBooleanSchema
  type: object
  additionalProperties: false
  required:
    - kind
  properties:
    kind:
      type: string
      enum:
        - boolean
CustomFieldDateSchema:
  title: CustomFieldDateSchema
  type: object
  additionalProperties: false
  required:
    - kind
  properties:
    kind:
      type: string
      enum:
        - date
    min:
      type: string
      format: date
    max:
      type: string
      format: date
CustomFieldDateTimeSchema:
  title: CustomFieldDateTimeSchema
  type: object
  additionalProperties: false
  required:
    - kind
  properties:
    kind:
      type: string
      enum:
        - datetime
    min:
      type: string
      format: date-time
    max:
      type: string
      format: date-time
CustomFieldURLSchema:
  title: CustomFieldURLSchema
  type: object
  additionalProperties: false
  required:
    - kind
    - allowed_schemes
  properties:
    kind:
      type: string
      enum:
        - url
    allowed_schemes:
      type: array
      minItems: 1
      items:
        type: string
        example: https
CustomFieldSelectSchema:
  title: CustomFieldSelectSchema
  type: object
  additionalProperties: false
  required:
    - kind
    - options
  properties:
    kind:
      type: string
      enum:
        - single_select
        - multi_select
    options:
      type: array
      minItems: 1
      items:
        $ref: "#/components/schemas/CustomFieldOption"
CustomFieldUserReferenceSchema:
  title: CustomFieldUserReferenceSchema
  type: object
  additionalProperties: false
  required:
    - kind
  properties:
    kind:
      type: string
      enum:
        - user_reference
    multiple:
      type: boolean
CustomFieldResourceReferenceSchema:
  title: CustomFieldResourceReferenceSchema
  type: object
  additionalProperties: false
  required:
    - kind
    - allowed_types
  properties:
    kind:
      type: string
      enum:
        - resource_reference
    allowed_types:
      type: array
      minItems: 1
      items:
        $ref: "#/components/schemas/ResourceType"
    multiple:
      type: boolean
CustomFieldSchema:
  title: CustomFieldSchema
  oneOf:
    - $ref: "#/components/schemas/CustomFieldTextSchema"
    - $ref: "#/components/schemas/CustomFieldIntegerSchema"
    - $ref: "#/components/schemas/CustomFieldDecimalSchema"
    - $ref: "#/components/schemas/CustomFieldBooleanSchema"
    - $ref: "#/components/schemas/CustomFieldDateSchema"
    - $ref: "#/components/schemas/CustomFieldDateTimeSchema"
    - $ref: "#/components/schemas/CustomFieldURLSchema"
    - $ref: "#/components/schemas/CustomFieldSelectSchema"
    - $ref: "#/components/schemas/CustomFieldUserReferenceSchema"
    - $ref: "#/components/schemas/CustomFieldResourceReferenceSchema"
  discriminator:
    propertyName: kind
    mapping:
      text: "#/components/schemas/CustomFieldTextSchema"
      integer: "#/components/schemas/CustomFieldIntegerSchema"
      decimal: "#/components/schemas/CustomFieldDecimalSchema"
      boolean: "#/components/schemas/CustomFieldBooleanSchema"
      date: "#/components/schemas/CustomFieldDateSchema"
      datetime: "#/components/schemas/CustomFieldDateTimeSchema"
      url: "#/components/schemas/CustomFieldURLSchema"
      single_select: "#/components/schemas/CustomFieldSelectSchema"
      multi_select: "#/components/schemas/CustomFieldSelectSchema"
      user_reference: "#/components/schemas/CustomFieldUserReferenceSchema"
      resource_reference: "#/components/schemas/CustomFieldResourceReferenceSchema"
CustomFieldDefinition:
  title: CustomFieldDefinition
  type: object
  additionalProperties: false
  required:
    - id
    - key
    - name
    - kind
    - scope_id
    - scope_type
    - target_type
    - required
    - archived
    - index_exact
    - index_range
    - index_fulltext
    - order
    - owner_user_id
    - schema
  properties:
    id:
      type: string
      example: 9bsv0s46s6s002p9ltq0
    key:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,62}$"
      example: story_points
    name:
      type: string
      minLength: 3
      maxLength: 120
      example: Story points
    description:
      type: string
      maxLength: 500
    kind:
      $ref: "#/components/schemas/CustomFieldKind"
    scope_id:
      type: string
      example: 9bsv0s46s6s002p9ltq0
    scope_type:
      $ref: "#/components/schemas/ResourceType"
    target_type:
      $ref: "#/components/schemas/ResourceType"
    required:
      type: boolean
    archived:
      type: boolean
    index_exact:
      type: boolean
    index_range:
      type: boolean
    index_fulltext:
      type: boolean
    order:
      type: integer
    owner_user_id:
      type: string
    registrar_client_id:
      type: string
    schema:
      $ref: "#/components/schemas/CustomFieldSchema"
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
      nullable: true
CustomFieldTextValue:
  title: CustomFieldTextValue
  type: object
  additionalProperties: false
  required:
    - kind
    - text
  properties:
    kind:
      type: string
      enum:
        - text
    text:
      type: string
CustomFieldIntegerValue:
  title: CustomFieldIntegerValue
  type: object
  additionalProperties: false
  required:
    - kind
    - integer
  properties:
    kind:
      type: string
      enum:
        - integer
    integer:
      type: integer
      format: int64
CustomFieldDecimalValue:
  title: CustomFieldDecimalValue
  type: object
  additionalProperties: false
  required:
    - kind
    - decimal
  properties:
    kind:
      type: string
      enum:
        - decimal
    decimal:
      type: string
      example: "12.50"
CustomFieldBooleanValue:
  title: CustomFieldBooleanValue
  type: object
  additionalProperties: false
  required:
    - kind
    - boolean
  properties:
    kind:
      type: string
      enum:
        - boolean
    boolean:
      type: boolean
CustomFieldDateValue:
  title: CustomFieldDateValue
  type: object
  additionalProperties: false
  required:
    - kind
    - date
  properties:
    kind:
      type: string
      enum:
        - date
    date:
      type: string
      format: date
CustomFieldDateTimeValue:
  title: CustomFieldDateTimeValue
  type: object
  additionalProperties: false
  required:
    - kind
    - datetime
  properties:
    kind:
      type: string
      enum:
        - datetime
    datetime:
      type: string
      format: date-time
CustomFieldURLValue:
  title: CustomFieldURLValue
  type: object
  additionalProperties: false
  required:
    - kind
    - url
  properties:
    kind:
      type: string
      enum:
        - url
    url:
      type: string
      format: uri
CustomFieldSingleSelectValue:
  title: CustomFieldSingleSelectValue
  type: object
  additionalProperties: false
  required:
    - kind
    - option_key
  properties:
    kind:
      type: string
      enum:
        - single_select
    option_key:
      type: string
CustomFieldMultiSelectValue:
  title: CustomFieldMultiSelectValue
  type: object
  additionalProperties: false
  required:
    - kind
    - option_keys
  properties:
    kind:
      type: string
      enum:
        - multi_select
    option_keys:
      type: array
      minItems: 1
      items:
        type: string
CustomFieldUserReferenceValue:
  title: CustomFieldUserReferenceValue
  type: object
  additionalProperties: false
  required:
    - kind
  properties:
    kind:
      type: string
      enum:
        - user_reference
    user_id:
      type: string
    user_ids:
      type: array
      items:
        type: string
CustomFieldResourceReferenceValue:
  title: CustomFieldResourceReferenceValue
  type: object
  additionalProperties: false
  required:
    - kind
  properties:
    kind:
      type: string
      enum:
        - resource_reference
    resource_id:
      type: string
    resource_ids:
      type: array
      items:
        type: string
CustomFieldValue:
  title: CustomFieldValue
  oneOf:
    - $ref: "#/components/schemas/CustomFieldTextValue"
    - $ref: "#/components/schemas/CustomFieldIntegerValue"
    - $ref: "#/components/schemas/CustomFieldDecimalValue"
    - $ref: "#/components/schemas/CustomFieldBooleanValue"
    - $ref: "#/components/schemas/CustomFieldDateValue"
    - $ref: "#/components/schemas/CustomFieldDateTimeValue"
    - $ref: "#/components/schemas/CustomFieldURLValue"
    - $ref: "#/components/schemas/CustomFieldSingleSelectValue"
    - $ref: "#/components/schemas/CustomFieldMultiSelectValue"
    - $ref: "#/components/schemas/CustomFieldUserReferenceValue"
    - $ref: "#/components/schemas/CustomFieldResourceReferenceValue"
  discriminator:
    propertyName: kind
    mapping:
      text: "#/components/schemas/CustomFieldTextValue"
      integer: "#/components/schemas/CustomFieldIntegerValue"
      decimal: "#/components/schemas/CustomFieldDecimalValue"
      boolean: "#/components/schemas/CustomFieldBooleanValue"
      date: "#/components/schemas/CustomFieldDateValue"
      datetime: "#/components/schemas/CustomFieldDateTimeValue"
      url: "#/components/schemas/CustomFieldURLValue"
      single_select: "#/components/schemas/CustomFieldSingleSelectValue"
      multi_select: "#/components/schemas/CustomFieldMultiSelectValue"
      user_reference: "#/components/schemas/CustomFieldUserReferenceValue"
      resource_reference: "#/components/schemas/CustomFieldResourceReferenceValue"
CustomFieldEntry:
  title: CustomFieldEntry
  type: object
  additionalProperties: false
  required:
    - definition
  properties:
    definition:
      $ref: "#/components/schemas/CustomFieldDefinition"
    value:
      $ref: "#/components/schemas/CustomFieldValue"
CustomFieldWrite:
  title: CustomFieldWrite
  type: object
  additionalProperties: false
  required:
    - definition_id
    - value
  properties:
    definition_id:
      type: string
      example: 9bsv0s46s6s002p9ltq0
    value:
      $ref: "#/components/schemas/CustomFieldValue"
CustomFieldSearchResult:
  title: CustomFieldSearchResult
  type: object
  additionalProperties: false
  required:
    - resource_ids
  properties:
    resource_ids:
      type: array
      items:
        type: string
CustomFieldPredicateOp:
  title: CustomFieldPredicateOp
  type: string
  enum:
    - eq
    - gt
    - gte
    - lt
    - lte
    - match
