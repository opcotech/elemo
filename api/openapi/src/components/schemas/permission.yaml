Action:
  title: Action
  type: string
  description: |
    Fine-grained authorization action. Exact match only; wildcards are not supported.

    Registry: organization.create, organization.read, organization.update, organization.delete, organization.members.manage, namespace.create, namespace.read, namespace.update, namespace.delete, project.create, project.read, project.update, project.delete, project.members.manage, issue.create, issue.read, issue.update, issue.delete, issue.assign, document.create, document.read, document.update, document.delete, folder.create, role.manage, team.manage, permission.manage, custom_field.manage.
  examples:
    - organization.read
    - project.update
    - permission.manage
    - custom_field.manage
Grant:
  title: Grant
  type: object
  description: A scoped ReBAC grant that binds a principal to actions on a resource.
  x-examples:
    example:
      id: 9bsv0s46s6s002p9ltq0
      principal: 9bsv0s46s6s002p9ltq0
      principal_type: User
      scope: 9bsv0s46s6s002p9ltq0
      scope_type: Organization
      role_id: null
      actions:
        - organization.read
        - project.update
      created_at: "2023-01-01T00:00:00Z"
      updated_at: null
  properties:
    id:
      type: string
      description: Unique identifier of the grant.
      example: 9bsv0s46s6s002p9ltq0
    principal:
      type: string
      description: ID of the principal that holds the grant.
      example: 9bsv0s46s6s002p9ltq0
    principal_type:
      $ref: "#/components/schemas/ResourceType"
    scope:
      type: string
      description: ID of the resource the grant applies to.
      example: 9bsv0s46s6s002p9ltq0
    scope_type:
      $ref: "#/components/schemas/ResourceType"
    role_id:
      type: string
      description: ID of the role whose actions are included in this grant.
      example: 9bsv0s46s6s002p9ltq0
      nullable: true
    actions:
      type: array
      description: Actions granted on the scope.
      items:
        $ref: "#/components/schemas/Action"
    created_at:
      type: string
      format: date-time
      description: Date when the grant was created.
    updated_at:
      type: string
      format: date-time
      description: Date when the grant was updated.
      nullable: true
  required:
    - id
    - principal
    - principal_type
    - scope
    - scope_type
    - role_id
    - actions
    - created_at
    - updated_at
EffectiveActions:
  title: EffectiveActions
  type: object
  description: Actions the caller can perform on a resource after ReBAC evaluation.
  properties:
    actions:
      type: array
      items:
        $ref: "#/components/schemas/Action"
      example:
        - project.read
        - issue.create
  required:
    - actions
GrantPrincipalType:
  title: GrantPrincipalType
  type: string
  description: Principal kinds that can hold grants.
  enum:
    - User
    - Team
    - Organization
Role:
  title: Role
  type: object
  description: A role bundle of actions that can be granted on a scope.
  x-examples:
    example:
      id: 9bsv0s46s6s002p9ltq0
      key: org-member
      name: Collaborators
      description: Users who can collaborate on the project.
      member_count: 1
      actions:
        - organization.read
        - project.read
      created_at: "2023-01-01T00:00:00Z"
      updated_at: null
  properties:
    id:
      type: string
      description: Unique identifier of the role.
      example: 9bsv0s46s6s002p9ltq0
    key:
      type: string
      description: Stable role template key.
      example: org-member
    name:
      type: string
      description: Name of the role.
      maxLength: 120
      example: Collaborators
      minLength: 3
    description:
      type: string
      description: Description of the role.
      maxLength: 500
      example: Users who can collaborate on the project.
      minLength: 5
      nullable: true
    member_count:
      type: integer
      format: int64
      description: Number of users assigned to the role when projected.
      example: 4
      nullable: true
    actions:
      type: array
      description: Actions bundled by this role.
      items:
        $ref: "#/components/schemas/Action"
    created_at:
      type: string
      format: date-time
      description: Date when the role was created.
    updated_at:
      type: string
      format: date-time
      description: Date when the role was updated.
      nullable: true
  required:
    - id
    - key
    - name
    - actions
    - created_at
    - updated_at
ResourceType:
  title: ResourceType
  type: string
  enum:
    - Assignment
    - Attachment
    - Comment
    - Document
    - Issue
    - IssueRelation
    - Label
    - Namespace
    - Notification
    - Organization
    - Permission
    - Project
    - ResourceType
    - Role
    - Team
    - Todo
    - User
    - UserToken
    - Folder
    - Installation
    - CustomFieldDefinition
RolePage:
  title: RolePage
  type: object
  properties:
    items:
      type: array
      items:
        $ref: "#/components/schemas/Role"
    page_info:
      $ref: "#/components/schemas/PageInfo"
  required:
    - items
    - page_info
