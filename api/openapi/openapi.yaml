          description: Unique identifier of the project.
          example: 9bsv0s46s6s002p9ltq0
        key:
          type: string
          description: Key of the project.
          minLength: 2
          maxLength: 6
          example: ENG
        name:
          type: string
          description: Name of the project.
          minLength: 3
          maxLength: 120
          example: Engineering Project
        description:
          type: string
          description: Description of the project.
          maxLength: 500
