          - rank:asc
          - rank:desc
          - numeric_id:asc
          - numeric_id:desc
          - title:asc
          - title:desc
          - priority:asc
          - priority:desc
          - status:asc
          - status:desc
          - due_date:asc
          - due_date:desc
          - created_at:asc
          - created_at:desc
          - updated_at:asc
          - updated_at:desc
      description: Sort order in `field:direction` format.
    search_page_size:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Maximum number of search hits to return.
    search_q:
      name: q
      in: query
      required: false
      schema:
        type: string
      description: Full-text query. Empty returns a filter-only page.
    search_types:
      name: types
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - Organization
            - Namespace
            - Project
            - Issue
            - Document
      description: Restrict results to these resource types.
    search_organization_id:
      name: organization_id
      in: query
      required: false
      schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      description: Restrict results to this organization xid.
    search_namespace_id:
      name: namespace_id
      in: query
      required: false
      schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      description: Restrict results to this namespace xid.
    search_project_id:
      name: project_id
      in: query
      required: false
      schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      description: Restrict results to this project xid.
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      description: ID of the resource.
    organizationRef:
      name: organizationRef
      in: path
      required: true
      schema:
        type: string
        example: acme
      description: >
        Organization xid or canonical kebab-case slug. Valid xids are parsed
        first; otherwise the value must be a canonical slug
        (`^[a-z0-9]+(?:-[a-z0-9]+)*$`, 3-50 characters). Xid-shaped slugs are
        rejected.
    namespaceRef:
      name: namespaceRef
      in: path
      required: true
      schema:
        type: string
        example: platform
      description: >
        Namespace xid or canonical kebab-case slug under the resolved
        organization. Valid xids are parsed first; a namespace xid under the
        wrong organization returns not found.
    projectKey:
      name: projectKey
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Z]{2,6}$
        example: PLAT
      description: Namespace-scoped project key. Uppercased on write; `NEW` is reserved.
    projectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      description: Project xid.
    documentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      description: ID of the document.
    folder_id:
      name: folder_id
      in: query
      required: false
      schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      description: >-
        Browse documents located in this folder. Omit to list unfiled documents
        at the library root.
    all:
      name: all
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: When true, return every document in the library regardless of folder.
    parent_id:
      name: parent_id
      in: query
      required: false
      schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      description: >-
        List folders located in this parent folder. Omit to list folders at the
        library root.
    relation_id:
      name: relation_id
      in: path
      required: true
      schema:
        type: string
        example: 9bsv0s46s6s002p9ltq0
      description: ID of the issue relation.
    issueKey:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Z]{2,6}-[1-9][0-9]*$
        example: MOB-1
      description: Composite issue key built from the owner project key and numeric ID.
    resourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
        example: Todo:9bsv0s46s6s002p9ltq0
      description: ID of the resource combined with its resource type.
    user_email:
      name: email
      in: query
      required: true
      schema:
        type: string
        format: email
        example: user@example.com
      description: Email address of the user.
    force:
      name: force
      in: query
      required: false
      schema:
        type: boolean
      description: Irreversibly delete the user.
    pluginId:
      name: pluginId
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z][a-z0-9]*(\.[a-z0-9]+)+$
        example: com.elemo.timetracking
      description: Reverse-domain plugin identifier.
