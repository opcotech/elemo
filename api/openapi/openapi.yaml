        type: integer
        minimum: 0
        default: 0
      description: Deprecated. Use page_token/page_size instead.
    limit:
      name: limit
      in: query
      required: false
      deprecated: true
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 1000
      description: Deprecated. Use page_size instead.
    page_size:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        default: 100
        minimum: 1
        maximum: 1000
      description: Maximum number of items to return.
    page_token:
      name: page_token
      in: query
      required: false
