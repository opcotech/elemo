          $ref: '#/components/schemas/IssueStatus'
      description: Match any of the provided statuses.
    issue_list_priority:
      name: priority
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/IssuePriority'
      description: Match any of the provided priorities.
    issue_list_order:
      name: order
      in: query
