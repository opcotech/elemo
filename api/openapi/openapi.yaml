    SystemHealth:
      title: SystemHealth
      type: object
      properties:
        cache_database:
          type: string
          enum:
            - healthy
            - unhealthy
            - unknown
          minLength: 7
          maxLength: 9
          description: Health of the cache database.
        graph_database:
          type: string
          enum:
            - healthy
            - unhealthy
            - unknown
          minLength: 7
          maxLength: 9
          description: Health of the graph database.
        relational_database:
          type: string
          enum:
            - healthy
            - unhealthy
            - unknown
          minLength: 7
          maxLength: 9
          description: Health of the relational database.
        license:
          type: string
          enum:
            - healthy
            - unhealthy
            - unknown
          minLength: 7
          maxLength: 9
          description: Health of the license.
        message_queue:
          type: string
          enum:
            - healthy
            - unhealthy
            - unknown
          minLength: 7
          maxLength: 9
          description: Health of the message queue.
        search:
          type: string
          enum:
            - healthy
            - unhealthy
            - unknown
          minLength: 7
          maxLength: 9
          description: Health of the search engine.
